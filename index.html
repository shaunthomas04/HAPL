<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPL Math Test</title>
</head>
<body>
    <!-- Outer subtraction -->
    <div class="-">
        <!-- First operand: 20 -->
        <span class="integer">20</span>

        <!-- Second operand: addition 5 + 3 -->
        <div class="+">
            <span class="integer">5</span>
            <span class="integer">3</span>
        </div>

        <!-- Third operand: multiplication 2 * 4 -->
        <div class="*">
            <span class="integer">2</span>
            <span class="integer">4</span>
        </div>

        <!-- Fourth operand: nested subtraction (10 - (1 + 1)) -->
        <div class="-">
            <span class="integer">10</span>
            <div class="+">
                <span class="integer">1</span>
                <span class="integer">1</span>
            </div>
        </div>
    </div>
</body>
</html>
