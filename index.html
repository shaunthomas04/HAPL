<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAPL Conditional Demo</title>
</head>

<body>

    <!-- ============================= -->
    <!-- CONDITIONAL EXAMPLE -->
    <!-- ============================= -->

    <div class="conditional">

        <!-- IF block -->
        <div class="if">
            <!-- Condition -->
            <span class="boolean">false</span>

            <!-- Statements -->
            <p><span class="string">"Hello world from if haha"</span></p>
        </div>

        <!-- ELIF block -->
        <div class="elif">
            <!-- Condition -->
            <span class="boolean">false</span>

            <!-- Statements -->
            <p><span class="string">"Hello from the else if statement"</span></p>
        </div>

        <!-- ELSE block -->
        <div class="else">
            <p><span class="string">"Everything else was false to get here"</span></p>
        </div>

    </div>


</body>
</html>
