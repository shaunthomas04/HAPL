<!DOCTYPE html>
<html>
<head><title>Nested Map Tests</title></head>
<body>

    <!-- Declare a map with a nested map inside -->
    <div class="map" id="company">
        <div class="name"><span class="string">"Acme"</span></div>
        <div class="ceo">
            <div class="map" id="">
                <div class="name"><span class="string">"bob"</span></div>
                <div class="age"><span class="integer">50</span></div>
            </div>
        </div>
    </div>

    <!-- Get the nested ceo map into a variable -->
    <var class="map" id="ceo">
        <div class="map-get">
            <var class="company"></var>
            <div class="key"><span class="string">"ceo"</span></div>
        </div>
    </var>

    <!-- Now get values out of the ceo map -->
    <var class="string" id="ceo-name">
        <div class="map-get">
            <var class="ceo"></var>
            <div class="key"><span class="string">"name"</span></div>
        </div>
    </var>

    <var class="integer" id="ceo-age">
        <div class="map-get">
            <var class="ceo"></var>
            <div class="key"><span class="string">"age"</span></div>
        </div>
    </var>

    <!-- Print them -->
    <p><var class="ceo-name"></var></p>
    <p><var class="ceo-age"></var></p>

    <!-- Print length of company map (should be 2: name and ceo) -->
    <p><div class="length">
        <var class="company"></var>
    </div></p>

    <!-- Print length of ceo map (should be 2: name and age) -->
    <p><div class="length">
        <var class="ceo"></var>
    </div></p>


    <!-- Function that takes a map and returns it with an updated value -->
    <div class="map-function" id="birthday">
        <div class="params">
            <div class="map-param" id="person"></div>
        </div>
        <div class="body">
            <div class="map-set">
                <var class="person"></var>
                <div class="key"><span class="string">"age"</span></div>
                <div class="value">
                    <div class="+">
                        <div class="map-get">
                            <var class="person"></var>
                            <div class="key"><span class="string">"age"</span></div>
                        </div>
                        <span class="integer">1</span>
                    </div>
                </div>
            </div>
            <div class="return">
                <var class="person"></var>
            </div>
        </div>
    </div>

    <!-- Declare a map -->
    <div class="map" id="alice">
        <div class="name"><span class="string">"alice"</span></div>
        <div class="age"><span class="integer">30</span></div>
    </div>

    <!-- Call the function and store the result -->
    <var class="map" id="updated">
        <div class="birthday">
            <div class="args">
                <var class="alice"></var>
            </div>
        </div>
    </var>

    <!-- Print the updated age -->
    <var class="integer" id="new-age">
        <div class="map-get">
            <var class="updated"></var>
            <div class="key"><span class="string">"age"</span></div>
        </div>
    </var>

    <p><var class="new-age"></var></p>

    <!-- Print length of updated map (should be 2: name and age) -->
    <p><div class="length">
        <var class="updated"></var>
    </div></p>

</body>
</html>
