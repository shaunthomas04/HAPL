<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAPL String Concat Test</title>
</head>

<body>

    <!-- greet(name: string, age: integer) -> void -->
    <!-- prints: "Name: Shaun, Age: 25" -->
    <div class="void-function" id="greet">
        <div class="params">
            <div class="string-param" id="name"></div>
            <div class="integer-param" id="age"></div>
        </div>
        <div class="body">
            <p>
                <div class="+">
                    <span class="string">"Name: "</span>
                    <var class="name"></var>
                    <span class="string">", Age: "</span>
                    <var class="age"></var>
                    <span class="string">"!"</span>
                </div>
            </p>
        </div>
    </div>


    <!-- Declare variables -->
    <var class="string" id="myName">
        <span class="string">"Shaun"</span>
    </var>

    <var class="integer" id="myAge">
        <span class="integer">25</span>
    </var>


    <!-- Call greet(myName, myAge) -->
    <div class="greet">
        <div class="args">
            <var class="myName"></var>
            <var class="myAge"></var>
        </div>
    </div>

</body>
</html>
