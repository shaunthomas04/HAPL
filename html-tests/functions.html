<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAPL Conditional Demo</title>
</head>

<body>

     <div class="string-function" id="function-name">
        <div class="params">
            <div class="string-param" id="person-name"> </div>
            <div class="integer-param" id="person-age"> </div>
        </div>

       
        <div class="body">
            <p>
                <span class="string">"Everything else was false to get here"</span>
            </p>
        </div>

    </div>



    <div class="function-name">
        <div class="args">
            <span class="string">"Shaun"</span>
            <span class="integer">21</span>
        </div>
    </div>




</body>
</html>
