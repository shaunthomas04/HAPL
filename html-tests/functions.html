<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAPL Circumference Demo</title>
</head>

<body>

    <!-- Function declaration: greet(name: string, age: integer) -> void -->
    <div class="void-function" id="greet">
        <div class="params">
            <div class="string-param" id="name"></div>
            <div class="integer-param" id="age"></div>
        </div>
        <div class="body">
            <p>
                <var class="name"></var>
            </p>
            <p>
                <var class="age"></var>
            </p>
        </div>
    </div>


    <!-- Function declaration: circumference(radius: integer) -> integer -->
    <!-- circumference = 2 * 3 * radius  (using 3 as approximation for pi) -->
    <div class="integer-function" id="circumference">

        <div class="params">
            <div class="integer-param" id="radius"></div>
        </div>

        <div class="body">

            <!-- return 2 * 3 * radius -->
            <div class="return">
                <div class="*">
                    <span class="integer">2</span>
                    <div class="*">
                        <span class="integer">3</span>
                        <var class="radius"></var>
                    </div>
                </div>
            </div>

        </div>

    </div>


    <!-- Declare variables -->
    <var class="string" id="myName">
        <span class="string">"Shaun"</span>
    </var>

    <var class="integer" id="myAge">
        <span class="integer">25</span>
    </var>

    <var class="integer" id="myRadius">
        <span class="integer">7</span>
    </var>


    <!-- Call greet(myName, myAge) -->
    <div class="greet">
        <div class="args">
            <var class="myName"></var>
            <var class="myAge"></var>
        </div>
    </div>


    <!-- Store circumference(myRadius) result into a variable -->
    <var class="integer" id="result">
        <div class="circumference">
            <div class="args">
                <var class="myRadius"></var>
            </div>
        </div>
    </var>


    <!-- Print the result -->
    <p>
        <var class="result"></var>
    </p>


</body>
</html>
