<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAPL Conditional Demo</title>
</head>

<body>

   <!-- Variable declaration -->
    <var class="integer" id="x">
        <span class="integer">1</span>
    </var>

    <!-- While loop -->
    <div class="while">
        <div class="condition">
            <div class="greater_equal">
                <span class="integer">5</span>
                <var class="x"></var>
            </div>
        </div>

        <div class="body">
            <p>
                <var class="x"></var>
            </p>

           <var class="x">
                <div class="+">
                    <var class="x"></var>
                    <span class="integer">1</span>
                </div>
            </var>
        </div>
    </div>


    <!-- Initialize y for for loop counter -->
    <var class="integer" id="y">
        <span class="integer">1</span>
    </var>

    <div class="for">
        <div class="iterator">
            <var class="y"></var>
        </div>
        <div class = "condition sdfg dfg gsdfg">
            <div class="greater_equal">
                <span class="integer">10</span>
                <var class="y"></var>
            </div>
        </div>
        
        <div class="increment extra classes">
            <span class="integer">1</span>
        </div>


        <div class="body">
            <p>
                <var class="y"></var>
            </p>
        </div>
    </div>






</body>
</html>
