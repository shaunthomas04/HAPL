<!DOCTYPE html>
<html>
<head><title>Input Test</title></head>
<body>

    <p><span class="string">"Enter your name: "</span></p>
    <var class="string" id="name">
        <div class="input"></div>
    </var>

    <p><span class="string">"Enter your age: "</span></p>
    <var class="string" id="age">
        <div class="input"></div>
    </var>

    <p>
        <div class="+">
            <div class="+">
                <div class="+">
                    <span class="string">"User "</span>
                    <var class="name"></var>
                </div>
                <span class="string">" is "</span>
            </div>
            <div class="+">
                <var class="age"></var>
                <span class="string">" years old"</span>
            </div>
        </div>
    </p>

</body>
</html>
